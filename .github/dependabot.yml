version: 2

updates:
  # cooldown: never propose a release younger than a week, so a freshly
  # published malicious version cannot reach a PR before the ecosystem notices
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      npm-packages:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Мажоры связанных пакетов — одним PR, иначе peer-deps конфликтуют
      # (eslint 10 ↔ @eslint/js 10, stylelint 17 ↔ stylelint-config-standard 40).
      eslint-major:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
        update-types:
          - "major"
      stylelint-major:
        patterns:
          - "stylelint"
          - "stylelint-*"
        update-types:
          - "major"

  # Python: pyproject.toml + uv.lock (Dependabot updates both)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      python-packages:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # MkDocs 2.0 is incompatible with Material 9.x (requires mkdocs<2) and the plugins:
    # never propose the major, such a PR can only have a red CI.
    ignore:
      - dependency-name: "mkdocs"
        update-types:
          - "version-update:semver-major"
