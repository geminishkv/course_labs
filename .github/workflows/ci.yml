---
name: ci

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ─── 1. Docs linting ────────────────────────────────────────────────────────
  docs_linter_checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: |
          yamllint --no-warnings .github/workflows mkdocs.yml

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: |
            docs/**/*.md
            labs/**/*.md
            README.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            CONTRIBUTING.md

  # ─── 2. CSS / JS linting ────────────────────────────────────────────────────
  layout_linter_checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Install JS/CSS linters
        run: npm ci

      - name: Lint JavaScript in docs
        run: |
          FILES=$(git ls-files 'docs/javascripts/*.js')
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs npx eslint
          else
            echo "No JS files found, skipping"
          fi

      - name: Lint CSS in docs
        run: |
          npx stylelint "docs/stylesheets/**/*.css"

  # ─── 3. Python dependency audit ─────────────────────────────────────────────
  dependency_audit_checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - docs_linter_checks
      - layout_linter_checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt pip-audit
          pip-audit -r requirements.txt

  # ─── 4. Security: Python code scan ──────────────────────────────────────────
  security_py_checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - dependency_audit_checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install bandit
        run: pip install bandit

      - name: Security scan with bandit
        run: |
          bandit -r labs -ll \
            -x "labs/basic/lab01/typersteel.py,labs/basic/lab02/exmpl_hello.py,labs/basic/lab02/pygamesteel.py,labs/basic/lab05/client/client.py,labs/basic/lab05/server/app.py,labs/basic/lab05/source/hello.py,labs/basic/lab07/vulnerable-app/app.py,labs/basic/lab08/dast/convert_reports.py,labs/basic/lab08/vulnerable-app/app.py"

  # ─── 6. Security: Dockerfile lint ───────────────────────────────────────────
  security_docker_checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs:
      - dependency_audit_checks

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install hadolint
        env:
          HADOLINT_VERSION: "2.15.1"
        run: |
          curl -sSL \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64" \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles with hadolint
        run: |
          find labs -name 'Dockerfile' -print0 | xargs -0 -n1 hadolint --failure-threshold error
        shell: bash

  # ─── 7a. PR: preview build ──────────────────────────────────────────────────
  docs-preview:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    needs:
      - docs_linter_checks
      - layout_linter_checks
      - dependency_audit_checks
      - security_py_checks

      - security_docker_checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build MkDocs site (preview)
        run: mkdocs build --site-dir site
        env:
          PYTHONPATH: .

      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: site-preview
          path: site

  # ─── 7b. Push: production build ─────────────────────────────────────────────
  build:
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    needs:
      - docs_linter_checks
      - layout_linter_checks
      - dependency_audit_checks
      - security_py_checks

      - security_docker_checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build MkDocs site
        run: mkdocs build --site-dir site
        env:
          PYTHONPATH: .

      - name: Inject Yandex Webmaster verification
        run: |
          printf '<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"></head><body>Verification: a0cf47e5e3a22cfc</body></html>\n' > site/yandex_a0cf47e5e3a22cfc.html

      - name: Verify site and sitemap
        run: |
          [ -d "site" ]        || { echo "site dir missing";    exit 1; }
          [ -f "site/sitemap.xml" ] || { echo "sitemap.xml missing"; exit 1; }
          [ -f "site/404.html" ]    || { echo "404.html missing";    exit 1; }

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  # ─── 8. Deploy to GitHub Pages ──────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/develop')
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

      - name: Create GitHub Deployment
        uses: chrnorm/deployment-action@500aa6a23c81ffa1acf71072aee3cfa2cc2e556a  # v2.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: production
          environment-url: ${{ steps.deployment.outputs.page_url }}
          transient-environment: false
          production-environment: true
