name: Deploy prod (reg.ru)

# Прод-раскатка на хостинг reg.ru: GitHub остаётся хранилищем и CI,
# сайт живёт на course.geminishkv.tech (docroot хостинга).
# Без секретов DEPLOY_* воркфлоу тихо пропускается — включается их добавлением.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & rsync
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check secrets
        id: gate
        env:
          H: ${{ secrets.DEPLOY_SSH_HOST }}
          K: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$H" ] || [ -z "$K" ]; then
            echo "Секреты DEPLOY_* не заданы — деплой пропущен"; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Build site
        if: steps.gate.outputs.go == 'true'
        run: |
          pip install -r requirements.txt
          mkdocs build --site-dir site
          cp deploy/.htaccess site/.htaccess

      - name: Deploy over rsync/ssh
        if: steps.gate.outputs.go == 'true'
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          # Пин ключа хоста: без known_hosts деплой на неопознанный хост не идёт
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::DEPLOY_SSH_KNOWN_HOSTS пуст — пин ключа хоста обязателен"; exit 1
          fi
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            site/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          echo "Раскатано: $DEPLOY_PATH"

      - name: Smoke check
        if: steps.gate.outputs.go == 'true'
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' https://course.geminishkv.tech/ || true)
          echo "https://course.geminishkv.tech/ -> $code"
