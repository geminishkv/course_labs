---
name: Release from Release Notes

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  release:
    name: Build site and create GitHub Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --frozen --no-dev

      - name: Build MkDocs site
        run: uv run --frozen mkdocs build --strict --site-dir site
        env:
          PYTHONPATH: .

      - name: Verify site and sitemap
        run: |
          [ -d "site" ]             || { echo "site dir missing";    exit 1; }
          [ -f "site/sitemap.xml" ] || { echo "sitemap.xml missing"; exit 1; }

      - name: Zip site
        run: |
          cd site
          zip -r "../site-${GITHUB_REF_NAME}.zip" .

      - name: SBOM of the locked runtime set (CycloneDX)
        run: .github/scripts/sbom.sh "sbom-${GITHUB_REF_NAME}.cdx.json"

      - name: Extract release notes for tag
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE="RELEASE_NOTES.md"

          if [ ! -f "$FILE" ]; then
            echo "Release notes file '$FILE' not found"
            exit 1
          fi

          CONTENT=$(awk -v tag="## ${TAG}" '
            BEGIN {found=0}
            $0 == tag {found=1; next}
            /^## / && found {exit}
            found {print}
          ' "$FILE")

          if [ -z "$CONTENT" ]; then
            echo "No notes found for tag ${TAG} in ${FILE}"
            exit 1
          fi

          {
            echo 'body<<EOF'
            echo "$CONTENT"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            site-${{ github.ref_name }}.zip
            sbom-${{ github.ref_name }}.cdx.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
