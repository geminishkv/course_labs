[extend]
useDefault = true

[[allowlists]]
description = "Lab example files — intentionally contain test secrets"
paths = [
  "labs/basic/lab07/vulnerable-app/.*",
  "labs/basic/lab08/vulnerable-app/.*",
  "labs/basic/lab08/dast/.*",
]

[[allowlists]]
description = "Cheatsheet examples — dummy secrets in documentation"
regexTarget = "match"
regexes = [
  "ENV API_KEY=REDACTED",
  "API_KEY.*REDACTED",
  "AKIAIOSFODNN7EXAMPLE",
]
