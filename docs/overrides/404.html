<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Страница не найдена | AppSec Course</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1A1919" />
  <meta name="description" content="Страница не найдена — AppSec Course" />

  <link rel="icon" type="image/png" href="/artifacts/assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #1A1919;
      --text:   #e8e8e8;
      --muted:  rgba(255, 255, 255, 0.55);
      --accent: #D51A1A;
      --gold:   #F9B361;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Roboto', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      max-width: 480px;
      width: 100%;
      padding: 0 24px;
      text-align: center;
      position: relative;
    }

    .page::before {
      content: "";
      position: fixed;
      top: 50%;
      right: clamp(-40%, -20vw, -10%);
      transform: translateY(-50%);
      width: clamp(400px, 80vw, 1500px);
      height: clamp(400px, 80vw, 1500px);
      background: url("/artifacts/assets/logo_white.svg") center / contain no-repeat;
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;
    }

    .page > * {
      position: relative;
      z-index: 1;
    }

    .code {
      font-family: 'Unbounded', sans-serif;
      font-size: clamp(80px, 20vw, 120px);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }

    .title {
      font-family: 'Unbounded', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 12px;
    }

    .desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 11px 22px;
      border-radius: 6px;
      font-family: 'Unbounded', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: background .2s, border-color .2s, color .2s;
      text-decoration: none;
    }

    .btn--primary {
      background: rgba(213, 26, 26, 0.15);
      border: 1px solid rgba(213, 26, 26, 0.35);
      color: #fff;
    }
    .btn--primary:hover { background: rgba(213, 26, 26, 0.25); border-color: rgba(213, 26, 26, 0.6); }

    .btn--ghost {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--muted);
    }
    .btn--ghost:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Dino runner ── */
    .dino-loader {
      width: 100%;
      max-width: 480px;
      height: 120px;
      position: relative;
      overflow: hidden;
      margin: 32px auto 0;
      border-bottom: 1px solid rgba(213, 26, 26, 0.2);
      display: flex;
      justify-content: center;
    }

    .dino-runner {
      width: 44px;
      height: 47px;
      position: absolute;
      bottom: 12px;
      left: 50%;
      margin-left: -22px;
      z-index: 2;
      filter: invert(1) brightness(0.7) sepia(1) hue-rotate(340deg) saturate(3);
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQgAAAAvAgMAAABiRrxWAAAADFBMVEX///9TU1P39/f///+TS9URAAAAAXRSTlMAQObYZgAAAPpJREFUeF7d0jFKRkEMhdGLMM307itNLALyVmHvJuzTDMjdn72E95PGFEZSmeoU4YMMgxhskvQec8YSVFX1NhGcS5ywtbmC8khcZeKq+ZWJ4F8Sr2+ZCErjkJFEfcjAc/6/BMlfcz6xHdhRthYzIZhIHMcTVY1scUUiAphK8CMSPUbieTBhvD9Lj0vyV4wklEGzHpciKGOJoBp7XDcFs4kWxxM7Ey3iZ8JbzASAvMS7XLOJHTTvEkEZSeQl7DMuwVyCasqK5+XzQRYLUJlMbPXjFcn3m8eKBSjWZMJwvGIOvViAzCbUj1VEDoqFOEQGE3SyInJQLOQMJL4B7enP1UbLXJQAAAAASUVORK5CYII=");
      animation: dinoRun 0.25s infinite steps(2), dinoJump 1.5s infinite linear;
    }

    .dino-obstacle {
      width: 17px;
      height: 35px;
      position: absolute;
      bottom: 12px;
      right: -50px;
      z-index: 1;
      filter: invert(1) brightness(0.7) sepia(1) hue-rotate(340deg) saturate(3);
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGYAAAAjCAMAAABRlI+PAAAADFBMVEX////////39/dTU1PhglcSAAAAAXRSTlMAQObYZgAAAPNJREFUeF7tlkEKwzAMBLXr//+5iQhU7gRRQkyhZI+DhwH74jhmO+oIJBVwURljuAXagG5QqkSgBLqg3JnxJ1Cb8SmQ3o6gpO85owGlOB4m2BNKJ11BSd01owGlOHkcIAuHkz6UNpPKgozPM54dADHjJuNhZiJxdQCQgZJeBczgCAAy3yhPJvcnmdC9mZwBIsQMFV5AkzHBNknFgcKM+oyDIFcfCAoy03m+jSMIcmoVZkKqSjr1fghyahRmoKRUHYLiSI1SMlCq5CDgX6BXmKkfn+oQ0KEyyrzoy8GbXJ9xrM/YjhUZgl9nnsyTCe9rgSRdV15CwRcIEu8GGQAAAABJRU5ErkJggg==");
      animation: moveObstacle 1.5s infinite linear;
    }

    .dino-ground {
      width: 100%;
      height: 12px;
      position: absolute;
      bottom: 5px;
      filter: invert(1) brightness(0.5);
      background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABLAAAAAMAgMAAAAPCKxBAAAABlBMVEX///9TU1NYzE1OAAAAAXRSTlMAQObYZgAAALJJREFUeF7t1EEKAyEMhtEvMNm7sPfJEVyY+1+ltLgYAsrQCtWhbxEhQvhxIJtSZypxa/WGshgzKdbq/UihMFMlt3o/CspEYoihIMaAb6mCvM6C+BTAeyo+wN4yykV/6pVfkdLpVyI1hh7GJ6QunUoLEQlQglNP2nkQkeF8+ei9cLxMue1qxVRfk1Ej0s6AEGWfVOk0QUtnK5Xo0Lac6wpdtnQqB6VxomPaz+dgF1PaqqmeWJlz1jYUaSIAAAAASUVORK5CYII=");
      background-repeat: repeat-x;
      animation: moveGround 4s linear infinite;
    }

    @keyframes dinoRun {
      from { background-position: -44px 0; }
      to   { background-position: -132px 0; }
    }

    @keyframes dinoJump {
      0%, 35%  { transform: translateY(0); }
      50%      { transform: translateY(-50px); }
      65%, 100%{ transform: translateY(0); }
    }

    @keyframes moveObstacle {
      0%   { right: -50px; }
      100% { right: 100%; }
    }

    @keyframes moveGround {
      from { background-position: 0 0; }
      to   { background-position: -1200px 0; }
    }

    .divider {
      height: 1px;
      background: linear-gradient(to right, var(--accent), rgba(213, 26, 26, 0.15), transparent);
      margin: 48px 0 24px;
    }

    .footer {
      font-size: 12px;
      color: var(--muted);
    }
    .footer a { color: var(--accent); transition: color .2s; text-decoration: none; }
    .footer a:hover { color: var(--gold); }

    @media (prefers-reduced-motion: reduce) {
      .dino-runner, .dino-obstacle, .dino-ground { animation: none; }
      .dino-obstacle { right: 30%; }
    }

    @media screen and (max-width: 600px) {
      .page { padding: 0 16px; }
      .code { font-size: clamp(60px, 18vw, 80px); }
      .title { font-size: 17px; }
      .desc { font-size: 13px; margin-bottom: 28px; }
      .actions { flex-direction: column; gap: 10px; }
      .btn { width: 100%; justify-content: center; padding: 12px 16px; }
      .divider { margin: 32px 0 16px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="code">404</div>
    <p class="title">Страница не найдена</p>
    <p class="desc">Такой страницы не существует или она была удалена.<br />Вернитесь на главную или загляните в лабораторные работы.</p>

    <div class="actions">
      <a href="/" class="btn btn--primary">

      <a href="/labs/basic/lab01/" class="btn btn--ghost">

    <div class="dino-loader">
      <div class="dino-runner"></div>
      <div class="dino-obstacle"></div>
      <div class="dino-ground"></div>
    </div>

    <div class="divider"></div>

    <footer class="footer">
      <p>© 2026 · <a href="https://geminishkv.tech/" target="_blank" rel="noreferrer">geminishkv.tech</a> · <a href="https://t.me/appsecta" target="_blank" rel="noreferrer">@appsecta</a> · <em>Sic Parvis Magna</em></p>
    </footer>
  </div>
</body>
</html>
