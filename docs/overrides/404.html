<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Страница не найдена | AppSec Course</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#1A1919" />

  <link rel="icon" type="image/png" href="/artifacts/assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #1A1919;
      --border: rgba(249, 179, 97, 0.15);
      --text:   #e8e8e8;
      --muted:  rgba(255, 255, 255, 0.55);
      --accent: #D51A1A;
      --gold:   #F9B361;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Roboto', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      max-width: 480px;
      width: 100%;
      padding: 0 24px;
      text-align: center;
      position: relative;
    }

    .page::before {
      content: "";
      position: fixed;
      top: 50%;
      right: clamp(-40%, -20vw, -10%);
      transform: translateY(-50%);
      width: clamp(400px, 80vw, 1500px);
      height: clamp(400px, 80vw, 1500px);
      background: url("/artifacts/assets/logo.svg") center / contain no-repeat;
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;
    }

    .page > * {
      position: relative;
      z-index: 1;
    }

    .code {
      font-family: 'Unbounded', sans-serif;
      font-size: clamp(80px, 20vw, 120px);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }

    .title {
      font-family: 'Unbounded', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 12px;
    }

    .desc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 11px 22px;
      border-radius: 6px;
      font-family: 'Unbounded', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: background .2s, border-color .2s, color .2s;
      text-decoration: none;
    }

    .btn--primary {
      background: rgba(213, 26, 26, 0.15);
      border: 1px solid rgba(213, 26, 26, 0.35);
      color: #fff;
    }
    .btn--primary:hover { background: rgba(213, 26, 26, 0.25); border-color: rgba(213, 26, 26, 0.6); }

    .btn--ghost {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--muted);
    }
    .btn--ghost:hover { border-color: var(--gold); color: var(--gold); }

    .divider {
      height: 1px;
      background: linear-gradient(to right, var(--accent), rgba(213, 26, 26, 0.15), transparent);
      margin: 48px 0 24px;
    }

    .footer {
      font-size: 12px;
      color: var(--muted);
    }
    .footer a { color: var(--accent); transition: color .2s; text-decoration: none; }
    .footer a:hover { color: var(--gold); }

    @media screen and (max-width: 600px) {
      .page { padding: 0 16px; }

      .code { font-size: clamp(60px, 18vw, 80px); }

      .title { font-size: 17px; }

      .desc { font-size: 13px; margin-bottom: 28px; }

      .actions { flex-direction: column; gap: 10px; }

      .btn { width: 100%; justify-content: center; padding: 12px 16px; }

      .divider { margin: 32px 0 16px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="code">404</div>
    <p class="title">Страница не найдена</p>
    <p class="desc">Такой страницы не существует или она была удалена.<br />Вернитесь на главную или загляните в лабораторные работы.</p>

    <div class="actions">
      <a href="/" class="btn btn--primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        На главную
      </a>
      <a href="/labs/basic/lab01/" class="btn btn--ghost">
        Лабораторные
      </a>
    </div>

    <div class="divider"></div>

    <footer class="footer">
      <p>© 2026 <a href="https://geminishkv.tech/" target="_blank" rel="noreferrer">geminishkv.tech</a> · <a href="https://t.me/shmakovis_appsec" target="_blank" rel="noreferrer">@shmakovis_appsec</a></p>
    </footer>
  </div>
</body>
</html>
