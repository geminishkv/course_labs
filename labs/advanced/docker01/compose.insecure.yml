# Небрежный стенд лабораторной docker01: так делать нельзя.
# Файл не правится: рабочая копия для исправлений называется compose.hardened.yml.
name: docker01

services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  api:
    build: ./source/api
    user: root
    privileged: true
    ports:
      - "5050:5050"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DB_HOST: db
      DB_PASSWORD: demo-password-change-me
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_PASSWORD: demo-password-change-me
