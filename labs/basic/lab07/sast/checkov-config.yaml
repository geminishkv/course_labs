# Checkov: проверка Dockerfile уязвимого приложения.
# Запуск из корня lab07: checkov --config-file sast/checkov-config.yaml
# docker-compose Checkov не разбирает: его проверяйте вручную по чек-листу лабы 06.

framework:
  - dockerfile

file:
  - vulnerable-app/Dockerfile

output: cli
quiet: false
download-external-modules: false

# Все проверки выполняются и попадают в отчёт, но код выхода ненулевой только
# при провале обязательных (названия из `checkov --list --framework dockerfile`)
soft-fail: true
hard-fail-on:
  - CKV_DOCKER_1     # порт 22 не открыт через EXPOSE
  - CKV_DOCKER_2     # есть инструкция HEALTHCHECK
  - CKV_DOCKER_3     # в образе создан пользователь
  - CKV_DOCKER_4     # COPY вместо ADD
  - CKV_DOCKER_7     # базовый образ с тегом, не latest
  - CKV_DOCKER_8     # последний USER не root
  - CKV2_DOCKER_16   # pip не отключает проверку сертификатов через PIP_TRUSTED_HOST
