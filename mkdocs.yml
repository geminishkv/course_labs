      - "Лабораторная работа №4": labs/lab04.md
      - "Лабораторная работа №5": labs/lab05.md
      - "Лабораторная работа №6": labs/lab06.md
      - "Лабораторная работа №7": labs/lab07.md
      - "Лабораторная работа №8": labs/lab08.md
