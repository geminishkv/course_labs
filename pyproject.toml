[project]
name = "course-labs"
version = "2.2.0"
description = "AppSec & DevSecOps course site (MkDocs Material)"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  # MkDocs core
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.7",
  "mkdocs-material-extensions==1.3.1",
  # MkDocs plugins
  "mkdocs-include-markdown-plugin==7.3.0",
  "mkdocs-meta-descriptions-plugin==4.1.0",
  "mkdocs-minify-plugin==0.8.0",
  "mkdocs-glightbox==0.5.2",
  "mkdocs-pdf==0.1.2",
  # Markdown extensions
  "pymdown-extensions==11.0.2",
  "Pygments==2.21.0",
  # Social cards (Material plugin dependency)
  "pillow>=12.3.0",
  "cairosvg>=2.9.0",
  # Transitive floors for CVE fixes: requests via mkdocs-material, PyYAML via mkdocs
  "requests>=2.34.2",
  "PyYAML==6.0.3",
]

# CI tools, one group per job; installed with `uv run --frozen --only-group <name>`
[dependency-groups]
lint = ["yamllint==1.38.0"]
audit = ["pip-audit==2.10.1"]
sast = ["bandit==1.9.4"]
sbom = ["cyclonedx-bom==7.3.1"]

[tool.uv]
package = false
